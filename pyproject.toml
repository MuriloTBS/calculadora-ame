[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orcamento-obra"
version = "0.1.0"
description = "Calculadora paramétrica de custo de obra por m² (NBR 12.721 / BDI TCU 2622-2013)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["orcamento_obra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
